org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Server API base URL (must end with /). Override per build: ./gradlew assembleRelease -Pprms.apiBaseUrl=https://.../api/v1/
prms.apiBaseUrl=https://genusitsolution.com/rentalsolutionfinal/api/v1/
# Debug builds use the SAME live server as release builds.
# FIX 2026-10-20: this line used to be active, so every DEBUG APK called
# http://10.0.2.2:8080 (the Android *emulator's* address for the PC). On a real
# phone that address does not exist -> "No internet connection or the server is
# not reachable". Only pass it on the command line when testing in the emulator:
#   ./gradlew :app:assembleDebug -Pprms.apiBaseUrlDebug=http://10.0.2.2:8080/api/v1/
# prms.apiBaseUrlDebug=http://10.0.2.2:8080/api/v1/
