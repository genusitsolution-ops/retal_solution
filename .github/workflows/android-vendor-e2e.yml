name: Vendor app end-to-end (emulator)

# 1.17 independent vendor: the real app on an emulator against the replay server (made-up vendor VEN10001):
# sign in with the vendor code → forced password change → vendor-only screens → logout. Screenshots as a draft release.
on:
  workflow_dispatch:
  push:
    branches: [ vendor-e2e ]

permissions:
  contents: write   # draft (team-only) release with the screenshots

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug app pointed at the replay server
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pprms.apiBaseUrlDebug=http://10.0.2.2:8090/api/v1/
      - name: Start the replay server
        run: nohup python3 tools/store-screens/replay.py tools/store-screens/fixtures.json 8090 > replay.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pprms.apiBaseUrlDebug=http://10.0.2.2:8090/api/v1/ -Pandroid.testInstrumentationRunnerArguments.class=com.genusit.prms.VendorAppTest -Pandroid.testInstrumentationRunnerArguments.vendorE2E=true && echo PASS > result.txt || { echo FAIL > result.txt; adb exec-out screencap -p > /tmp/fail.png; adb push /tmp/fail.png /data/local/tmp/vendor-zz-failure.png; }
            mkdir -p out && for f in $(adb shell ls /data/local/tmp/ | tr -d '\r' | grep '^vendor-'); do adb pull /data/local/tmp/$f out/$f; done
            adb logcat -d > out/logcat.txt || true
      - name: Result
        if: always()
        run: |
          echo "::notice title=Vendor E2E::$(cat result.txt 2>/dev/null || echo 'no result')"
          [ -f replay-misses.txt ] && sort | uniq -c < replay-misses.txt | head -40 | while read l; do echo "::notice title=replay miss::$l"; done || true
          grep -q "FATAL EXCEPTION" out/logcat.txt && echo "::error title=Crash::$(grep -A3 'FATAL EXCEPTION' out/logcat.txt | tr '\n' ' ' | head -c 400)" || true
          grep -q PASS result.txt
      - name: Publish (draft, members only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/*.png > /dev/null 2>&1 || exit 0
          gh release create "vendor-e2e-${{ github.run_number }}" out/*.png --draft --target "${{ github.sha }}" \
            --title "Vendor E2E ${{ github.run_number }}" --notes "1.17 independent vendor end-to-end screenshots"
