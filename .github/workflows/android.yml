name: Android build

on:
  push:
    paths: ["android/PRMSApp/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/PRMSApp/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.PRMS_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android/PRMSApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3

      - name: Unit tests (domain rules + Retrofit/OkHttp data layer)
        run: ./gradlew :domain:test :data:test --stacktrace

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Release builds are signed only when the owner's keystore is supplied as repository secrets.
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.PRMS_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Signed release APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          PRMS_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          PRMS_KEYSTORE_PASSWORD: ${{ secrets.PRMS_KEYSTORE_PASSWORD }}
          PRMS_KEY_ALIAS: ${{ secrets.PRMS_KEY_ALIAS }}
          PRMS_KEY_PASSWORD: ${{ secrets.PRMS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: prms-android
          path: |
            android/PRMSApp/app/build/outputs/apk/**/*.apk
            android/PRMSApp/app/build/outputs/bundle/**/*.aab
            android/PRMSApp/app/build/reports/lint-results-*.html
          if-no-files-found: warn
