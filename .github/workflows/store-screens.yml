# Google Play store screenshots of the real app: debug build → replay server with a made-up demo owner
# (tools/store-screens). Phone 1080×1920, 7-inch tablet 1215×2160, 10-inch tablet 1440×2560 (all 9:16).
name: Store screenshots

on:
  workflow_dispatch:
  push:
    branches: [ store-screens ]

permissions:
  contents: write   # draft (team-only) release with the screenshots

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            skin: ""
            density: ""
          - device: tablet7
            skin: "-skin 1215x2160"
            density: "320"
          - device: tablet10
            skin: "-skin 1440x2560"
            density: "240"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug app pointed at the demo replay server
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pprms.apiBaseUrlDebug=http://10.0.2.2:8090/api/v1/
      - name: Start the demo replay server
        run: nohup python3 tools/store-screens/replay.py tools/store-screens/fixtures.json 8090 > replay.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator (${{ matrix.device }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim ${{ matrix.skin }}
          script: |
            if [ -n "${{ matrix.density }}" ]; then adb shell wm density ${{ matrix.density }}; fi
            adb shell wm size; adb shell wm density
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter || true
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1000 || true
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false || true
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 || true
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false || true
            ./gradlew :app:connectedDebugAndroidTest -Pprms.apiBaseUrlDebug=http://10.0.2.2:8090/api/v1/ -Pandroid.testInstrumentationRunnerArguments.class=com.genusit.prms.StoreScreenshotsTest -Pandroid.testInstrumentationRunnerArguments.storeShots=true || echo "::error title=Store shots::test failed on ${{ matrix.device }}"
            mkdir -p out && for f in $(adb shell ls /data/local/tmp/ | tr -d '\r' | grep '^store-'); do adb pull /data/local/tmp/$f out/${{ matrix.device }}-${f#store-}; done
      - name: Check sizes and list replay misses
        run: |
          python3 - <<'PY'
          import glob, struct
          for f in sorted(glob.glob('out/*.png')):
              w, h = struct.unpack('>II', open(f, 'rb').read()[16:24])
              print(f"::notice title={f}::{w}x{h}")
          PY
          [ -f replay-misses.txt ] && sort | uniq -c < replay-misses.txt | head -40 | while read l; do echo "::notice title=replay miss::$l"; done || true
          ls out | wc -l
      - name: Publish (draft, members only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/*.png > /dev/null 2>&1 || exit 0
          gh release create "store-shots-${{ matrix.device }}-${{ github.run_number }}" out/*.png --draft --target "${{ github.sha }}" \
            --title "Store screenshots ${{ matrix.device }} ${{ github.run_number }}" --notes "Play Store screenshots (${{ matrix.device }})"
