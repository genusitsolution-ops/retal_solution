# 1.15: WhatsApp / WhatsApp Business choice on Android 14 (package-visibility rules of Android 11+ apply),
# with stand-in apps installed under the real package names. Made-up phone number and message only.
name: Android WhatsApp choice test (emulator)

on:
  workflow_dispatch:
  push:
    branches: [ app-1.15 ]
    paths: [ ".github/workflows/android-whatsapp.yml", "app/src/main/kotlin/com/genusit/prms/ui/common/WhatsAppApps.kt", "app/src/androidTest/kotlin/com/genusit/prms/WhatsAppChoiceUiTest.kt" ]

permissions:
  contents: write   # draft (team-only) release with the results

jobs:
  whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK and test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build WhatsApp stand-in apps
        run: bash .github/scripts/wa-stubs.sh build stubs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            bash .github/scripts/wa-stubs.sh push stubs
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.genusit.prms.WhatsAppChoiceUiTest || true
            mkdir -p shots && adb pull /data/local/tmp/whatsapp-settings.png shots/ || true
            adb pull /data/local/tmp/whatsapp-business-opened.png shots/ || true
      - name: Test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, sys
          files = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          if not files: print("::error title=WhatsApp tests::no results (tests did not run)"); sys.exit(1)
          passed, failed = [], []
          for f in files:
              for tc in ET.parse(f).getroot().iter('testcase'):
                  fail = tc.find('failure')
                  if fail is not None:
                      failed.append(tc.get('name')); print(f"::error title={tc.get('name')}::" + (fail.get('message') or fail.text or '')[:600].replace('\n', ' '))
                  else: passed.append(tc.get('name'))
          print(f"::notice title=WhatsApp summary::{len(passed)} passed, {len(failed)} failed: " + ", ".join(sorted(passed)))
          sys.exit(1 if failed or not passed else 0)
          PY
      - name: Results as draft release (team-only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots; cp -r app/build/outputs/androidTest-results/connected shots/results 2>/dev/null || true
          (cd shots && zip -qr ../whatsapp-test.zip .)
          gh release create "android-whatsapp-${{ github.run_number }}" whatsapp-test.zip --draft --target "${{ github.sha }}" \
            --title "Android WhatsApp choice test ${{ github.run_number }}" --notes "Emulator results from ${{ github.sha }}"
